
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Management System</h1>
        <p>Manage student records easily</p>
    </header>

    <main class="container">
        <section class="form-section">
            <h2 id="formTitle">Add New Student</h2>

            <form id="studentForm">
                <input type="hidden" id="editIndex">

                <label for="name">Student Name</label>
                <input type="text" id="name" placeholder="Enter student name" required>

                <label for="roll">Roll Number</label>
                <input type="text" id="roll" placeholder="Enter roll number" required>

                <label for="course">Course</label>
                <input type="text" id="course" placeholder="Enter course name" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email address" required>

                <button type="submit" id="submitBtn">Add Student</button>
                <button type="button" id="cancelBtn" class="cancel-btn" hidden>
                    Cancel Edit
                </button>
            </form>
        </section>

        <section class="records-section">
            <h2>Student Records</h2>

            <input type="search" id="search" placeholder="Search by name, roll number or course">

            <p id="studentCount">Total Students: 0</p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Roll No.</th>
                            <th>Course</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentList"></tbody>
                </table>
            </div>

            <p id="emptyMessage">No student records found. Add your first student!</p>
        </section>
    </main>

    <footer>
        <p>Student Management System | HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
